# site-ops スキルが読むサイト設定。
# 収集: npx -y github:nisioka/site-ops-ai#v0.2.0 collect

name: "sun0range"

# GA4 プロパティID
ga4_property_id: "properties/317202891"

# Search Console のプロパティ（URLプレフィックス形式で登録済み）
gsc_site_url: "https://sun0range.tech.server-on.net/"

# サイトの前提。
context: |
  「分かりやすい技術ブログ」。個人が書いている技術記事のブログで、Gatsby 製。
  自宅サーバ（server-on.net のサブドメイン）で運用している。広告・アフィリエイトは
  入れておらず、収益化はしていない。

  読者は、具体的な技術課題を検索して来るエンジニア。題材は実際に自分が詰まって
  解決したことが中心で、環境構築・エラー対応・ツール比較などが多い。
  ログインの壁は無く、全ページが検索エンジンから到達できる。記事そのものが
  コンテンツなので、検索流入は目的に直結する。

  ## 記事は2系統ある

  フロントマターの形式が違うので、編集前に対象がどちらの系統かを必ず確認すること。

  - `content/blog/<slug>/index.md` — 現在書いているもの。
    `title` / `date` / `dateModified` / `description` / `featuredImagePath` /
    `nodeType` / `category`（日本語）/ `tags`
  - `content/old-blog/posts/<slug>/index.md` — WordPress から移行したもの。
    `title` / `date` / `categories`（配列・英語スラッグ）/ `tags` / `coverImage`

  meta description は `src/templates/blog-post.tsx` が `description={post.excerpt}` を
  SEO コンポーネントへ渡し、`src/components/seo.tsx` が
  `description || siteMetadata.description` で決める。フロントマターに `description` が
  あればそれが使われ、無ければ本文冒頭からの自動抜粋になる。

  ## URL と記事ファイルの対応

  記事の URL は `/<カテゴリスラッグ>/<記事スラッグ>/`。
  例: `categories: business-efficiency` の `not-auto-save-office365`
  → `https://sun0range.tech.server-on.net/business-efficiency/not-auto-save-office365/`

  Search Console のページ URL から記事ファイルを探すときは、スラッグ部分で
  `content/blog/` と `content/old-blog/posts/` の両方を検索すること。

  ## 打ち手の方針

  既存記事の `title` / `description`、内部リンク、構造化データの改善は PR にしてよい。

  新規記事を書く提案は、書き手の関心と実体験に依存するため勝手に決めず、
  Issue で論点を提示するに留める。

  記事の内容そのものを書き換える提案は、事実確認ができる範囲に限る。検証していない
  手順や数値を追記しない。旧記事には古い情報が含まれるが、現行仕様を確認できない
  ものは断定して書き換えない。

  クリック数が小さいページについては、クリックの増減率を根拠にしない。
  表示回数と掲載順位の推移で見ること。
